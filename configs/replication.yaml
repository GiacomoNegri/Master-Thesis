data:
  target_dim: 1

model:
  timeemb: 256
  featureemb: 64
  is_unconditional: true

diffusion:
  # num_steps: 200
  diffusion_embedding_dim: 256
  channels: 128
  layers: 4
  nheads: 8
  is_linear: false

process:
  N: 2000
  sde_type: gbm
  noise_schedule: exponential
  sigma_min: 0.01
  sigma_max: 10.0
  beta_min: 0.01
  beta_max: 10.0
  model_steps: 200
  eps: 1.0e-2
  enforce_observed: true
  round_times: false
  time_num_bins: 10
  time_multiplier: 1
  min_eps: null            # lower clamp for sampled noise in forward process (null = no clip)
  max_eps: null            # upper clamp for sampled noise in forward process (null = no clip)
  eps_multiplier: 1.0      # scale factor applied to sampled noise after clipping/rounding (1 = no scaling)

train:
  seed: 42
  epochs: 10
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  use_amp: true
  # mask_mode controls what the model conditions on during training:
  #   random        – randomly hide 10-90% of all entries (original CSDI behaviour)
  #   unconditional – no context at all; pair with is_unconditional: true in model
  #   predict_close – always condition on Open/High/Low/Volume; Close is the target
  mask_mode: unconditional
  cond_min_ratio: 0.1
  cond_max_ratio: 0.9
  debug: false                # if true, print per-batch sigma / err / eps diagnostics
  loss_spike_factor: null     # if set (e.g. 5.0), print a line whenever loss > factor × ema_loss
  lr_scheduler: none          # 'cosine-annealing' | 'reduce-on-plateau' | 'none'; overrides lr_cosine_annealing
  lr_eta_min: 1.0e-6          # minimum LR for cosine-annealing and reduce-on-plateau floor
  lr_gamma: 0.8              # multiplicative factor for reduce-on-plateau
  lr_patience: null           # patience epochs for reduce-on-plateau (must be > 0 when used)
  lr_cosine_annealing: false  # [legacy] superseded by lr_scheduler; kept for backward compat
  ema_beta: 0.98           # smoothing factor for the step-level EMA loss display
  log_every_steps: 50
  save_every_steps: 1000
  print_plots: false        # if true, save 11 diagnostic PNGs to out_dir/diagnostics/ every plots_every epochs
  plots_every: 50            # generate diagnostic plots every N epochs (only active when print_plots: true)
  seq_len: 2048
  stride: 400
  num_workers: 4
  shuffle: true
  pin_memory: false
  out_dir: ./checkpoints/gbm
  data_root: ./data/replication_returns_other_gbm
  #  val_split_ratio: 0.1   # fraction of dataset held out for validation
  # train_subset_ratio: 1.0  # fraction of dataset used for training (quick tFests)
  # train_subset_size: 1 # absolute number of training samples (alternative to ratio)
  early_stop_patience: 10  # stop if val loss doesn't improve for this many epochs (null to disable)
  window_center_mean: true  # if true, subtract per-window mean (along time axis) before training

wandb:
  entity: thesis-giacomo-negri   # your W&B team name
  project: csdi-gbm          # project name on wandb.ai
  # run_name:                      # human-readable run label (auto-generated if blank)
