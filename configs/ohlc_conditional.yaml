data:
  target_dim: 4                                   # O, H, L, C — no Volume
  columns: ["date", "open", "high", "low", "close"]  # forwarded to make_dataloader; must match CSV headers

model:
  timeemb: 128
  featureemb: 64
  is_unconditional: false                         # conditional mode: OHL observed, Close predicted

diffusion:
  num_steps: 100                                  # diffusion-time embedding size; keep = model_steps
  diffusion_embedding_dim: 128
  channels: 64
  layers: 4
  nheads: 4
  is_linear: false

process:
  sde_type: ve
  noise_schedule: exponential
  sigma_min: 0.01
  sigma_max: 5.0                                  # data is z-scored (σ≈1 per window), 5σ covers tails
  beta_min: 0.01
  beta_max: 20.0
  N: 1000                                         # SDE discretisation steps
  model_steps: 100                                # reverse sampler steps; keep = num_steps
  eps: 1.0e-3
  enforce_observed: true

train:
  seed: 42
  epochs: 200
  batch_size: 64
  lr: 1.0e-4
  weight_decay: 1.0e-4
  use_amp: true

  # Conditioning strategy
  # predict_close: always condition on Open/High/Low, always predict Close (feature index 3)
  # cond_min/max_ratio are unused in this mode but required by build_run_metadata
  mask_mode: predict_close
  cond_min_ratio: 0.1
  cond_max_ratio: 0.9

  debug: false
  likelihood_weighting: false
  importance_sampling: false
  lr_cosine_annealing: false
  lr_eta_min: 1.0e-6
  ema_beta: 0.98

  log_every_steps: 50
  save_every_steps: 1000

  # seq_len and stride must match the preprocessing in notebooks/Toy_dataset_gbm.ipynb
  # stride = seq_len is required: the CSVs are pre-normalised in non-overlapping blocks
  seq_len: 64
  stride: 64

  num_workers: 4
  shuffle: true
  pin_memory: false

  data_root: ./data/fake_fts_processed
  out_dir: ./checkpoints/ohlc_conditional

  # val_split_ratio: 0.1
  early_stop_patience: 20

wandb:
  entity: thesis-giacomo-negri
  project: csdi-ohlc
  # run_name:                                     # auto-generated if left blank
